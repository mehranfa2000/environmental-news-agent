name: 🌿 Environmental News Agent

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ دریافت کدها
        uses: actions/checkout@v4

      - name: 🐍 نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 نصب کتابخانه‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 اجرای ایجنت
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
        run: python bot.py

      - name: 💾 ذخیره تاریخچه و آمار
        run: |
          git config --global user.name  "Env-News-Agent"
          git config --global user.email "agent@env-news.ir"
          git add history.json stats.json || true
          git diff --staged --quiet || git commit -m "🔄 آپدیت تاریخچه — $(date +'%Y-%m-%d %H:%M')"
          git push || true
